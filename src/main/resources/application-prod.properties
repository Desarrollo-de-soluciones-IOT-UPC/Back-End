# ── Perfil de producción ─────────────────────────────────────────────────────
# MySQL corre como contenedor en la misma máquina (servicio "db" del compose),
# en una red interna de Docker: no está expuesto a internet.
#
# Variables inyectadas desde deploy/.env:
#   MYSQL_URL  MYSQL_USER  MYSQL_PASSWORD  JWT_SECRET
#   CORS_ALLOWED_ORIGINS  APP_PUBLIC_URL  GEMINI_API_KEY

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — la BD está en la misma red que la app, así que ya no hacen falta
# los keepalives agresivos que exigía la base gestionada remota (cerraba las
# conexiones ociosas a los ~60s). Pool pequeño: la VM tiene poca CPU y MySQL
# rinde mejor con pocas conexiones activas que con muchas ociosas.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# El esquema lo gobierna Flyway (V1..V12); Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.com.emsafe=INFO
logging.level.org.springframework.security=WARN

server.port=${PORT:8080}
# Caddy es quien termina TLS; sin esto Spring vería todo como http y generaría
# enlaces y redirecciones con el esquema equivocado.
server.forward-headers-strategy=framework

# ── Gemini (chatbot "Astra") ─────────────────────────────────────────────────
# Si GEMINI_API_KEY viene vacío, el chat queda desactivado pero el resto de la
# aplicación funciona con normalidad.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-2.5-flash
# Sin timeouts, un Gemini lento bloquea hilos de Tomcat hasta tumbar toda la API.
gemini.connect-timeout-ms=5000
gemini.read-timeout-ms=20000
