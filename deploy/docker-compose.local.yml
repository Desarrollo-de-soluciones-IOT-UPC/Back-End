# ---------------------------------------------------------------------------
# EMSafe — stack COMPLETO en local (db + backend + frontend), un solo comando.
#
#   navegador ──▶ caddy :8090 ──┬── /          SPA Angular
#                               ├── /api/*     reverse proxy ─▶ backend:8080
#                               ├── /ws        reverse proxy ─▶ backend:8080
#                               └── /swagger-ui  ─▶ backend:8080
#                                       backend ──▶ db:3306
#
# 👉 Se abre UNA sola URL: http://localhost:8090
#
# Puertos elegidos para NO chocar con lo que ya corre en la laptop:
#   8090 → Caddy   (el 80 suele estar tomado en Windows)
#   8081 → backend (el 8080 lo ocupa el contenedor emsafe-backend-demo)
#   3307 → MySQL   (el 3306 lo ocupa el MySQL Server instalado en Windows)
#
# La BD es un contenedor con su propio volumen: NO toca tu MySQL local ni la
# base de TiDB. Al arrancar vacía, DataInitializer la siembra sola.
#
# Uso:
#   docker compose -f deploy/docker-compose.local.yml up -d --build
#   docker compose -f deploy/docker-compose.local.yml logs -f backend
#   docker compose -f deploy/docker-compose.local.yml down          # parar
#   docker compose -f deploy/docker-compose.local.yml down -v       # + borrar BD
# ---------------------------------------------------------------------------

name: emsafe-local

services:

  db:
    image: mysql:8.0
    container_name: emsafe-db-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: emsafe_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Expuesto solo para que puedas inspeccionar la BD con Workbench/DBeaver.
      - "3307:3306"
    volumes:
      - db_data_local:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks: [emsafe-local-net]

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: emsafe-backend:local
    container_name: emsafe-backend-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod   # perfil "prod" = MySQL por variables de entorno
      MYSQL_URL: "jdbc:mysql://db:3306/emsafe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8"
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      # Secreto SOLO de desarrollo local. El de producción vive en deploy/.env.
      JWT_SECRET: "ZW1zYWZlLWxvY2FsLWRldi1zZWNyZXQta2V5LTMyLWJ5dGVzLW1pbmltdW0tb2sh"
      # Si exportas GEMINI_API_KEY en tu shell, el chat Astra funciona; si no,
      # el resto de la app va igual y solo el chat queda desactivado.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: "http://localhost:8090"
      APP_PUBLIC_URL: "http://localhost:8090"
      JAVA_OPTS: "-XX:MaxRAMPercentage=70 -Duser.timezone=America/Lima"
    ports:
      # No es necesario para la SPA (Caddy hace de proxy), pero va muy bien para
      # pegarle a la API con curl/Postman sin pasar por el proxy.
      - "8081:8080"
    networks: [emsafe-local-net]

  web:
    build:
      context: ../../Front-End
      dockerfile: Dockerfile
    image: emsafe-web:local
    container_name: emsafe-web-local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8090:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks: [emsafe-local-net]

networks:
  emsafe-local-net:
    driver: bridge

volumes:
  db_data_local:
