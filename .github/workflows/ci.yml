# CI del backend: ejecuta los tests, compila y valida que la imagen Docker se construya.
# El despliegue NO va aquí: la VM de Oracle hace pull + build por SSH
# (ver deploy/README.md). Los workflows *.disabled de esta carpeta son los
# antiguos de Azure App Service, conservados como referencia histórica.

name: CI — Back-End

# Se dispara en CUALQUIER rama, no solo en main. El refactor DDD se hizo entero
# en `refactor/ddd` y no pasó por CI ni una vez: un gate que solo mira main llega
# tarde, cuando el trabajo ya está hecho y romperlo cuesta caro.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests de dominio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 110 tests que corren en ~1 s: los agregados y VOs no necesitan Spring
      # ni base de datos. Es el dividendo del refactor a DDD.
      - name: Ejecutar tests
        run: mvn -B test

      # Sin esto, un fallo obliga a leerse el log entero para saber qué rompió.
      - name: Publicar informes de surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Compilar y empaquetar
    runs-on: ubuntu-latest
    needs: test          # no se empaqueta nada que no pase los tests
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Los tests ya corrieron en el job anterior; aquí solo se empaqueta.
      - name: Empaquetar
        run: mvn -B clean package -DskipTests

      - name: Verificar que la imagen Docker se construye
        run: docker build -t emsafe-backend:ci .
